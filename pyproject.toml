[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-skills"
version = "0.10.3"
description = "Agent skills and prompts."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Francesco Rolando" }
]
keywords = ["shell", "scripts", "uv", "astral", "uvx", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]

dependencies = [
]

[dependency-groups]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Ogekuri/CLI-Skills"
Repository = "https://github.com/Ogekuri/CLI-Skills"

[project.scripts]
cli-skills = "cli_skills.core:main"
skills = "cli_skills.core:main"

[tool.setuptools]
package-dir = {"" = "src", "cli_skills.resources" = "src/resources"}
packages = ["cli_skills", "cli_skills.resources"]
include-package-data = false

[tool.setuptools.package-data]
cli_skills = ["*.py"]
"cli_skills.resources" = ["**/*"]

[tool.setuptools.exclude-package-data]
"cli_skills.resources" = ["*.pyc", "__pycache__/*"]
